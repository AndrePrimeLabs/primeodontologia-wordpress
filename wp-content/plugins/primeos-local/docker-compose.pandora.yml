version: "3.9"

services:
  gateway:
    image: traefik:v3.0
    container_name: pandora-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "5000:5000"
      - "8080:8080"     # Traefik dashboard: http://<pandora-ip>:8080
    volumes:
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - primeos-mesh

  postgres:
    image: postgres:16
    container_name: pandora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: primeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: primeos_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - primeos-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeos -d primeos_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: pandora-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
    networks:
      - primeos-mesh

  crm-x:
    build: ./services/crm-x
    container_name: pandora-crm-x
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgres://primeos:${POSTGRES_PASSWORD:-pass}@postgres:5432/primeos_app
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crmx.rule=PathPrefix(`/api/customers`) || PathPrefix(`/api/interactions`) || PathPrefix(`/api/tickets`)"
      - "traefik.http.routers.crmx.entrypoints=web,api"
      - "traefik.http.services.crmx.loadbalancer.server.port=4001"

  chan-x:
    build: ./services/chan-x
    container_name: pandora-chan-x
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgres://primeos:${POSTGRES_PASSWORD:-pass}@postgres:5432/primeos_app
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chanx.rule=PathPrefix(`/api/channels`) || PathPrefix(`/api/campaigns`)"
      - "traefik.http.routers.chanx.entrypoints=web,api"
      - "traefik.http.services.chanx.loadbalancer.server.port=4002"

  seg-x:
