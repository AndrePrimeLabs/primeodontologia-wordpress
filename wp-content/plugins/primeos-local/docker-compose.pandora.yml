        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.segx.rule=PathPrefix(`/api/segments`) || PathPrefix(`/api/personas`)"
      - "traefik.http.routers.segx.entrypoints=web,api"
