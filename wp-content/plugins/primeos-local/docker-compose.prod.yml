version: '3.8'

services:
  # ============================================================================
  # PRIMEOS FRONTEND
  # ============================================================================
  primeos-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: primeos:latest
    container_name: primeos-app
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    networks:
      - primeos-net
    volumes:
      - primeos-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - pandora-backend
    labels:
      - "com.docker.compose.project=primeos"

  # ============================================================================
  # PALIT PANDORA BACKEND (Primary Backend Management)
  # ============================================================================
  pandora-backend:
    image: pandora-backend:latest  # Update with actual Palit Pandora image
    container_name: pandora-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.pandora
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pandora_db
      - LOG_LEVEL=info
    networks:
      - primeos-net
    volumes:
      - pandora-data:/app/data
      - pandora-config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres

  # ============================================================================
  # POSTGRESQL DATABASE (Shared for Pandora & PrimeOS)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.postgres
    environment:
      - POSTGRES_DB=pandora_db
      - POSTGRES_USER=pandora_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - primeos-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandora_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # OPENCLAW (Already running, included for orchestration)
  # ============================================================================
  openclaw:
    image: openclaw:latest  # Update with your OpenClaw image
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env.openclaw
    environment:
      - NODE_ENV=production
    networks:
      - primeos-net
    volumes:
      - openclaw-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # NGINX REVERSE PROXY & LOAD BALANCER
  # ============================================================================
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - primeos-net
    depends_on:
      - primeos-app
      - pandora-backend
      - openclaw
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # OPTIONAL: REDIS CACHE (for session/cache management)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - primeos-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

networks:
  primeos-net:
    driver: bridge

volumes:
  primeos-data:
  pandora-data:
  pandora-config:
  postgres-data:
  openclaw-data:
  redis-data:
  nginx-cache:
