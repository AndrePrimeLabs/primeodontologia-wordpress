      PORT: 4003
      DATABASE_URL: postgres://primeos_app:primeos_secret@postgres:5432/primeos_app
      NATS_URL: nats://nats:4222
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.segx.rule=PathPrefix(`/api/segments`) || PathPrefix(`/api/personas`)"
      - "traefik.http.routers.segx.entrypoints=web,api"
      - "traefik.http.services.segx.loadbalancer.server.port=4003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 4. REV-X (Port 4004) - Revenue Streams, Products & Transactions
