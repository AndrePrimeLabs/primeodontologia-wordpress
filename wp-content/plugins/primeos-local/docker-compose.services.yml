    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actx.rule=PathPrefix(`/api/activities`) || PathPrefix(`/api/sops`)"
      - "traefik.http.routers.actx.entrypoints=web,api"
      - "traefik.http.services.actx.loadbalancer.server.port=4005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 6. VALUE-X (Port 4006) - Value Propositions & Solution Fit
