version: '3.8'

services:
  # ============================================================================
  # TRAEFIK API GATEWAY (Reverse Proxy for all 9 BMC Microservices)
  # ============================================================================
  gateway:
    image: traefik:v3
    container_name: primeos-gateway
    restart: unless-stopped
    ports:
      - "80:80"       # Web entrypoint
      - "${PRIMEOS_API_PORT:-5001}:5000"   # PrimeOS Client API entrypoint (port 5001 avoids macOS AirPlay collision)
      - "8080:8080"   # Traefik Dashboard: http://localhost:8080
    volumes:
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - primeos-mesh

  # ============================================================================
  # NATS MESSAGE BROKER (Event Mesh for Microservices)
  # ============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: primeos-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222" # Management / monitoring dashboard
    networks:
      - primeos-mesh

  # ============================================================================
  # POSTGRESQL (Multi-Tenant RLS Database for Microservices)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: primeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: primeos
      POSTGRES_PASSWORD: primeos_secret
      POSTGRES_DB: primeos_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - primeos-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeos -d primeos_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 1. CRM-X (Port 4001) - Customer Relationship Management
  # ============================================================================
  crm-x:
    build:
      context: ./services/crm-x
    container_name: primeos-crm-x
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: postgres://primeos_app:primeos_secret@postgres:5432/primeos_app
      NATS_URL: nats://nats:4222
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crmx.rule=PathPrefix(`/api/customers`) || PathPrefix(`/api/interactions`) || PathPrefix(`/api/tickets`) || PathPrefix(`/api/events`) || PathPrefix(`/api/follow-ups`)"
      - "traefik.http.routers.crmx.entrypoints=web,api"
      - "traefik.http.services.crmx.loadbalancer.server.port=4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 2. CHAN-X (Port 4002) - Channels & Paid Campaigns
  # ============================================================================
  chan-x:
    build:
      context: ./services/chan-x
    container_name: primeos-chan-x
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgres://primeos_app:primeos_secret@postgres:5432/primeos_app
      NATS_URL: nats://nats:4222
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chanx.rule=PathPrefix(`/api/channels`) || PathPrefix(`/api/campaigns`)"
      - "traefik.http.routers.chanx.entrypoints=web,api"
      - "traefik.http.services.chanx.loadbalancer.server.port=4002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 3. SEG-X (Port 4003) - Customer Segments & Personas
  # ============================================================================
  seg-x:
