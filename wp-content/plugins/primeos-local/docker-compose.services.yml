    networks:
      - primeos-mesh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.revx.rule=PathPrefix(`/api/products`) || PathPrefix(`/api/transactions`)"
      - "traefik.http.routers.revx.entrypoints=web,api"
      - "traefik.http.services.revx.loadbalancer.server.port=4004"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 5. ACT-X (Port 4005) - Key Activities & SOPs
  # ============================================================================
  act-x:
