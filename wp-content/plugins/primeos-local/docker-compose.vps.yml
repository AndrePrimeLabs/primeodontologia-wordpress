  #     - postgres-data:/var/lib/postgresql/data
  #   
  #   networks:
  #     - primeos-internal
  #   
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ============================================================================
  # OPTIONAL: REDIS CACHE (for session/performance)
  # ============================================================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis-cache
  #   restart: unless-stopped
  #   
  #   volumes:
  #     - redis-data:/data
  #   
  #   networks:
  #     - primeos-internal
  #   
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   
  #   command: redis-server --appendonly yes

networks:
  traefik-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
  
  primeos-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

volumes:
  traefik-acme:
    driver: local
  primeos-data:
    driver: local
  primeos-cache:
    driver: local
  # postgres-data:
  #   driver: local
  # redis-data:
  #   driver: local

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
#
# 1. SSH into VPS:
#    ssh root@your-vps-ip
#
# 2. Navigate to project:
#    cd /root/primeos-local
#
# 3. Create .env.production:
#    cp .env.example .env.production
#    # Edit with actual values
#
# 4. Create Traefik config:
#    # See traefik.yml and config.yml files
#
# 5. Build and deploy:
#    docker compose -f docker-compose.vps.yml up --build -d
#
# 6. Verify:
#    docker compose -f docker-compose.vps.yml ps
#    docker compose -f docker-compose.vps.yml logs -f primeos-app
#
# 7. Test HTTPS:
#    curl -I https://primeos.primeodontologia.com.br
#
# 8. Access dashboard (internal):
#    http://your-vps-ip:8080/dashboard
#
# ============================================================================
