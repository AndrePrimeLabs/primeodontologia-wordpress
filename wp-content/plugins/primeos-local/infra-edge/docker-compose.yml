###############################################################################
# PrimeOsHub — Phase 0 Edge Stack
# Hardware: Palit Pandora Box · NVIDIA JetPack 6 · ARM64
# Run: docker compose --env-file .env up -d
###############################################################################

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &always
  restart: always

x-healthcheck-pg: &hc-pg
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5

x-healthcheck-redis: &hc-redis
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5

networks:
  primeos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pg-data:
  redis-data:
  nemoclaw-models:
  primeos-uploads:
  prometheus-data:
  grafana-data:

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: primeos-postgres
    <<: [*always, *hc-pg]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-primeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-primeos_db}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      primeos-net:
        ipv4_address: 172.20.0.10
    ports:
      - "127.0.0.1:5432:5432"
    logging: *default-logging

  # ── Cache ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: primeos-redis
    <<: [*always, *hc-redis]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis-data:/data
    networks:
      primeos-net:
        ipv4_address: 172.20.0.11
    ports:
      - "127.0.0.1:6379:6379"
    logging: *default-logging

  # ── PrimeOS Core API ──────────────────────────────────────────────────────
  primeos-api:
    image: ${REGISTRY:-ghcr.io/primeos}/primeos-api:${TAG:-latest}
    container_name: primeos-api
    <<: *always
    build:
      context: ../../primeos-core
      dockerfile: Dockerfile
    environment:
      NODE_ENV:          production
      PORT:              3000
      DATABASE_URL:      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRES_IN:    ${JWT_EXPIRES_IN:-7d}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WHATSAPP_TOKEN:    ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      GITHUB_TOKEN:      ${GITHUB_TOKEN}
      NOTION_TOKEN:      ${NOTION_TOKEN}
      NETLIFY_TOKEN:     ${NETLIFY_TOKEN}
      CORS_ORIGINS:      ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      primeos-net:
        ipv4_address: 172.20.0.20
    volumes:
      - primeos-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── PrimeOS UI ────────────────────────────────────────────────────────────
  primeos-ui:
    image: ${REGISTRY:-ghcr.io/primeos}/primeos-ui:${TAG:-latest}
    container_name: primeos-ui
    <<: *always
    environment:
      VITE_API_URL:     ${API_URL:-http://localhost/api}
      VITE_WS_URL:      ${WS_URL:-ws://localhost/ws}
      VITE_APP_VERSION: ${TAG:-dev}
    networks:
      primeos-net:
        ipv4_address: 172.20.0.21
    depends_on:
      - primeos-api
    logging: *default-logging

  # ── Clara Agent (WhatsApp AI) ─────────────────────────────────────────────
  clara-agent:
    image: ${REGISTRY:-ghcr.io/primeos}/clara-agent:${TAG:-latest}
    container_name: primeos-clara
    <<: *always
    build:
      context: ../../clara-agent
      dockerfile: Dockerfile
    environment:
      AGENT_NAME:        clara
      PRIMEOS_API_URL:   http://primeos-api:3000
      PRIMEOS_API_KEY:   ${INTERNAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      WHATSAPP_TOKEN:    ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      NEMOCLAW_URL:      http://nemoclaw:8080
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL:         ${LOG_LEVEL:-info}
    depends_on:
      - primeos-api
      - nemoclaw
      - redis
    networks:
      primeos-net:
        ipv4_address: 172.20.0.30
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Luzia Agent (Governance) ───────────────────────────────────────────────
  luzia-agent:
    image: ${REGISTRY:-ghcr.io/primeos}/luzia-agent:${TAG:-latest}
    container_name: primeos-luzia
    <<: *always
    build:
      context: ../../luzia-agent
      dockerfile: Dockerfile
    environment:
      AGENT_NAME:        luzia
      PRIMEOS_API_URL:   http://primeos-api:3000
      PRIMEOS_API_KEY:   ${INTERNAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL:      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      NEMOCLAW_URL:      http://nemoclaw:8080
      ALERT_WEBHOOK:     ${LUZIA_ALERT_WEBHOOK}
      GOVERNANCE_INTERVAL_MS: ${GOVERNANCE_INTERVAL_MS:-60000}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
    depends_on:
      - primeos-api
      - postgres
      - nemoclaw
    networks:
      primeos-net:
        ipv4_address: 172.20.0.31
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── NemoClaw Sandbox Runtime ───────────────────────────────────────────────
  nemoclaw:
    image: nvcr.io/nvidia/nemo/nemoclaw:latest
    container_name: primeos-nemoclaw
    <<: *always
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NEMOCLAW_POLICY_PATH: /policies
      NEMOCLAW_LOG_LEVEL:   ${LOG_LEVEL:-info}
      NEMOCLAW_PORT:        8080
    volumes:
      - ./nemoclaw/policies:/policies:ro
      - nemoclaw-models:/models
    networks:
      primeos-net:
        ipv4_address: 172.20.0.40
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    logging: *default-logging

  # ── NGINX Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: primeos-nginx
    <<: *always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - primeos-api
      - primeos-ui
      - clara-agent
    networks:
      primeos-net:
        ipv4_address: 172.20.0.50
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: primeos-prometheus
    <<: *always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      primeos-net:
        ipv4_address: 172.20.0.60
    ports:
      - "127.0.0.1:9090:9090"
    logging: *default-logging

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: primeos-grafana
    <<: *always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     false
      GF_SERVER_ROOT_URL:         ${GRAFANA_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      primeos-net:
        ipv4_address: 172.20.0.61
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - prometheus
    logging: *default-logging
