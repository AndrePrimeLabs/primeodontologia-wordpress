# PrimeOsHub — NGINX Reverse Proxy Config
# Palit Pandora Edge Node

upstream primeos_api {
    server primeos-api:3000;
    keepalive 32;
}

upstream primeos_ui {
    server primeos-ui:80;
    keepalive 16;
}

upstream clara_webhook {
    server clara-agent:3001;
    keepalive 8;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    location /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/primeos.crt;
    ssl_certificate_key /etc/nginx/ssl/primeos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50M;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # API
    location /api/ {
        proxy_pass         http://primeos_api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket
    location /ws {
        proxy_pass         http://primeos_api/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # WhatsApp webhook (Clara)
    location /webhook/whatsapp {
        proxy_pass       http://clara_webhook/webhook/whatsapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health
    location /health {
        proxy_pass http://primeos_api/health;
    }

    # UI (catch-all)
    location / {
        proxy_pass         http://primeos_ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;

        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        proxy_pass http://primeos_ui/index.html;
    }
}
