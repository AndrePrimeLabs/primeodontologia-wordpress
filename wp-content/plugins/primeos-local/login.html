<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/prime-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PrimeOS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 400px;
        padding: 40px;
      }
      .logo-container { text-align: center; margin-bottom: 30px; }
      .logo-container img { height: 50px; margin-bottom: 10px; }
      .logo-container h1 { font-size: 24px; color: #333; margin: 0; }
      .login-form { display: flex; flex-direction: column; gap: 20px; }
      .form-group { display: flex; flex-direction: column; gap: 8px; }
      .form-group label { font-weight: 500; color: #333; font-size: 14px; }
      .form-group input {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
      }
      .login-button {
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102,126,234,0.4);
      }
      .login-button:disabled { opacity: 0.7; cursor: not-allowed; }
      .error-message {
        color: #dc2626;
        font-size: 14px;
        display: none;
        text-align: center;
        padding: 10px;
        background: #fee2e2;
        border-radius: 6px;
      }
      .loading { display: none; text-align: center; color: #667eea; }
      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #e0e0e0;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo-container">
        <img src="/prime-logo.svg" alt="PrimeOS Logo" />
        <h1>PrimeOS</h1>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Sua senha"
            required
          />
        </div>
        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span id="loadingText">Autenticando...</span>
        </div>
        <div class="form-group" id="resetPasswordGroup" style="display:none">
          <label for="newPassword">Nova senha</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Digite a nova senha"
            minlength="6"
          />
          <button type="button" class="login-button" id="updatePasswordBtn">
            Salvar nova senha
          </button>
        </div>
        <div style="text-align:center;margin-top:8px">
          <a href="#" id="forgotLink">Esqueci minha senha</a>
        </div>
        <button type="submit" class="login-button" id="loginBtn">
          Entrar
        </button>
        <button type="button" class="login-button" id="guestBtn" style="background: #10b981; margin-top: 8px;">
          Acessar Modo Local / Demo
        </button>
      </form>
    </div>

    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

      const supabase = createClient(
        'https://foeahubnrbclbelsqikp.supabase.co',
        'sb_publishable_MnURfwn0NCO-70pR4pF4Vw_Sl4r3CLA'
      )

      const form = document.getElementById('loginForm')
      const emailInput = document.getElementById('email')
      const passwordInput = document.getElementById('password')
      const errorMessage = document.getElementById('errorMessage')
      const loading = document.getElementById('loading')
      const loadingText = document.getElementById('loadingText')
      const loginBtn = document.getElementById('loginBtn')
      const guestBtn = document.getElementById('guestBtn')
      if (guestBtn) {
        guestBtn.addEventListener('click', () => {
          localStorage.setItem('primeos_auth', '1')
          localStorage.setItem('primeos_active_tenant_id', '00000000-0000-4000-a000-000000000001')
          localStorage.setItem('primeos_user', JSON.stringify({
            email: 'admin@primeodontologia.com.br',
            name: 'Administrador (Modo Local / Demo)',
            role: 'admin'
          }))
          window.location.href = './'
        })
      }

      const forgotLink = document.getElementById('forgotLink')
      const resetPasswordGroup = document.getElementById('resetPasswordGroup')
      const newPasswordInput = document.getElementById('newPassword')
      const updatePasswordBtn = document.getElementById('updatePasswordBtn')

      function showMessage(message, isError = true) {
        errorMessage.textContent = message
        errorMessage.style.display = 'block'
        errorMessage.style.color = isError ? '#dc2626' : '#047857'
        errorMessage.style.background = isError ? '#fee2e2' : '#d1fae5'
      }

      function setLoading(isLoading, label = 'Autenticando...') {
        loadingText.textContent = label
        loading.style.display = isLoading ? 'block' : 'none'
        loginBtn.disabled = isLoading
        updatePasswordBtn.disabled = isLoading
      }

      function getAuthLinkType() {
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''))
        const searchParams = new URLSearchParams(window.location.search)
        return hashParams.get('type') || searchParams.get('type') || ''
      }

      function showPasswordSetup(type = getAuthLinkType()) {
        resetPasswordGroup.style.display = 'flex'
        loginBtn.style.display = 'none'
        forgotLink.style.display = 'none'
        const message = type === 'invite'
          ? 'Convite aceito. Digite uma senha para ativar sua conta.'
          : 'Digite sua nova senha para concluir a redefinição.'
        showMessage(message, false)
      }

      supabase.auth.onAuthStateChange((event, session) => {
        if (session?.access_token) {
          localStorage.setItem('primeos_token', session.access_token)
        }
        if (session?.user?.email) {
          localStorage.setItem('primeos_auth', '1')
          localStorage.setItem('primeos_user', JSON.stringify({
            email: session.user.email,
            name: session.user.email.split('@')[0]
          }))
        }
        const linkType = getAuthLinkType()
        if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session && linkType === 'invite')) {
          showPasswordSetup(linkType)
        }
      })

      form.addEventListener('submit', async (e) => {
        e.preventDefault()

        const email = emailInput.value.trim()
        const password = passwordInput.value

        // Reset UI
        errorMessage.style.display = 'none'
        setLoading(true)

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          })

          if (error) {
            throw error
          }

          localStorage.setItem('primeos_auth', '1')
          if (data.session?.access_token) {
            localStorage.setItem('primeos_token', data.session.access_token)
          }
          localStorage.setItem('primeos_user', JSON.stringify({
            email: data.user.email,
            name: data.user.email.split('@')[0]
          }))
          window.location.href = './'
        } catch (error) {
          console.error('Login error:', error)
          const statusText = error.status ? ` (${error.status})` : ''
          const detailText = error.details ? ` — ${error.details}` : ''
          const defaultText = error.code === 'invalid_credentials'
            ? 'Verifique seu email e senha ou use Esqueci minha senha.'
            : ''
          showMessage(`Falha na autenticação${statusText}: ${error.message || 'erro desconhecido'}${detailText}` + (defaultText ? ` ${defaultText}` : ''))
          setLoading(false)
        }
      })

      // Forgot password handler
      forgotLink.addEventListener('click', async (e) => {
        e.preventDefault()
        const email = emailInput.value.trim()
        if (!email) {
          showMessage('Digite seu email acima para receber o link de redefinição.')
          return
        }

        // UI
        errorMessage.style.display = 'none'
        setLoading(true, 'Enviando link...')

        try {
          const { error: resetError } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: `${window.location.origin}${window.location.pathname}`
          })

          if (resetError) {
            throw resetError
          }

          showMessage('Se o email existir, um link de redefinição foi enviado.', false)
        } catch (resetError) {
          console.error('Reset error:', resetError)
          showMessage('Erro ao gerar reset: ' + (resetError.message || JSON.stringify(resetError)))
        } finally {
          setLoading(false)
        }
      })

      updatePasswordBtn.addEventListener('click', async () => {
        const password = newPasswordInput.value
        if (!password || password.length < 6) {
          showMessage('A nova senha precisa ter pelo menos 6 caracteres.')
          return
        }

        errorMessage.style.display = 'none'
        setLoading(true, 'Salvando senha...')

        try {
          const { error } = await supabase.auth.updateUser({ password })
          if (error) {
            throw error
          }
          showMessage('Senha atualizada. Redirecionando...', false)
          const { data: { user } } = await supabase.auth.getUser()
          const { data: { session } } = await supabase.auth.getSession()
          if (session?.access_token) {
            localStorage.setItem('primeos_token', session.access_token)
          }
          if (user?.email) {
            localStorage.setItem('primeos_auth', '1')
            localStorage.setItem('primeos_user', JSON.stringify({
              email: user.email,
              name: user.email.split('@')[0]
            }))
          }
          window.location.href = './'
        } catch (error) {
          console.error('Password update error:', error)
          showMessage('Erro ao salvar nova senha: ' + (error.message || JSON.stringify(error)))
          setLoading(false)
        }
      })

      async function verifyEmailLinkIfNeeded() {
        const searchParams = new URLSearchParams(window.location.search)
        const tokenHash = searchParams.get('token_hash')
        const type = searchParams.get('type')

        if (!tokenHash || !type) {
          return false
        }

        try {
          setLoading(true, 'Validando link...')
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type
          })
          if (error) {
            throw error
          }

          const cleanUrl = `${window.location.origin}${window.location.pathname}#type=${encodeURIComponent(type)}`
          window.history.replaceState({}, document.title, cleanUrl)

          if (type === 'invite' || type === 'recovery') {
            showPasswordSetup(type)
            return true
          }

          window.location.href = './'
          return true
        } catch (error) {
          console.error('Invite link verification error:', error)
          showMessage('Link inválido ou expirado. Peça um novo convite ou redefinição de senha.')
          return true
        } finally {
          setLoading(false)
        }
      }

      async function redirectIfAuthenticated() {
        try {
          const handledEmailLink = await verifyEmailLinkIfNeeded()
          if (handledEmailLink) {
            return
          }

          const { data: { session }, error } = await supabase.auth.getSession()
          if (error) {
            console.error('Session check error:', error)
            return
          }
          const linkType = getAuthLinkType()
          const isPasswordSetupUrl = linkType === 'recovery' || linkType === 'invite'
          if (session && isPasswordSetupUrl) {
            showPasswordSetup(linkType)
            return
          }
          if (session) {
            localStorage.setItem('primeos_auth', '1')
            localStorage.setItem('primeos_user', JSON.stringify({
              email: session.user.email,
              name: session.user.email.split('@')[0]
            }))
            window.location.href = './'
          }
        } catch (error) {
          console.error('Session check failed:', error)
        }
      }

      redirectIfAuthenticated()
    </script>
  </body>
</html>
