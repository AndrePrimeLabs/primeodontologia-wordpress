# PrimeOS Multi-Domain Nginx Configuration
# Routes:
# - primeos.primeodontologia.com.br → Port 8080 (frontend) + 5001 (API)
# - omnios.primeodontologia.com.br → Port 8081 (frontend) + 5002 (API)

# ============================================================================
# PRIMEOS - Main clinic/dental application
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name primeos.primeodontologia.com.br;

    # Redirect HTTP → HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name primeos.primeodontologia.com.br;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/primeos.primeodontologia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primeos.primeodontologia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/primeos_access.log combined;
    error_log /var/log/nginx/primeos_error.log warn;

    # Frontend - Port 8080
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # API - Port 5001
    location /api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID primeos;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:5001/health;
        access_log off;
    }
}

