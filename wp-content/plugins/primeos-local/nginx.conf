# ============================================================================
# NGINX CONFIGURATION FOR PRIMEOS
# ============================================================================
# Optimized for:
#   - React SPA (Single Page Application) routing
#   - Performance (gzip, caching, compression)
#   - Security (headers, CSP, X-Frame-Options)
#   - Local development (CORS, API proxying)
# ============================================================================

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================

server {
    # Listen on port 80 (HTTP)
    listen 80 default_server;
    listen [::]:80 default_server;

    # Server name
    server_name _;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ========================================================================
    # SECURITY HEADERS
    # ========================================================================
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS protection in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Permissions policy (formerly Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (CSP) - allows self, data URIs, and trusted CDNs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:* https:;" always;

    # ========================================================================
    # SPA ROUTING
    # ========================================================================
    # Route all requests through index.html for React Router
    location / {
        # try_files: Try file → try dir → fallback to index.html
        try_files $uri $uri/ /index.html;

        # Cache index.html minimally (changes frequently)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # ========================================================================
    # ACME CHALLENGE (Let's Encrypt SSL) - MUST BE BEFORE DENY RULES
    # ========================================================================
    location /.well-known/acme-challenge/ {
        try_files $uri =404;
        access_log off;
    }

    # ========================================================================
    # STATIC ASSETS CACHING
    # ========================================================================
    # Cache versioned assets (build hash in filename) for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        # Only cache files with content hash in name (e.g., app-abc123.js)
        if ($request_filename ~* "^.*(\.[-0-9a-zA-Z]{8}\.js|\.[-0-9a-zA-Z]{8}\.css)$") {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header ETag "";
        }

        # Non-hashed assets (rare) - short cache
        expires 1d;
        add_header Cache-Control "public, must-revalidate";

        # Disable ETag for versioned files
        if ($request_filename ~* "\.[-0-9a-zA-Z]{8}\.(js|css)$") {
            add_header ETag "";
        }
    }

    # ========================================================================
    # DENY ACCESS TO SENSITIVE FILES
    # ========================================================================
    # Block hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common config files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========================================================================
    # GZIP COMPRESSION
    # ========================================================================
    # Handled in nginx.conf (global level)
    # But ensure it's enabled for key content types
    # Already set globally, this is just for reference

    # ========================================================================
    # API PROXY (LOCAL DEVELOPMENT)
    # ========================================================================
    # Optional: Proxy to backend services during local dev
    # Uncomment if needed

    # Proxy to Supabase
    # location /api/supabase/ {
    #     proxy_pass http://supabase:54321/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Proxy to Firebase Emulator
    # location /api/firebase/ {
    #     proxy_pass http://firebase-emulator:4000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ========================================================================
    # LOGGING
    # ========================================================================
    # Custom log format
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Don't log common static file requests
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
    }

    # ========================================================================
    # PERFORMANCE OPTIMIZATIONS
    # ========================================================================
    # Gzip already enabled globally in nginx.conf

    # Disable directory listing
    autoindex off;

    # Increase buffer sizes for large responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ========================================================================
    # ERROR PAGES
    # ========================================================================
    # Serve index.html for 404 (SPA needs this)
    error_page 404 =200 /index.html;

    # Other error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ========================================================================
    # HEALTH CHECK ENDPOINT
    # ========================================================================
    # Simple endpoint for load balancers and Docker health checks
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================================================
    # STATUS ENDPOINT (LOCAL DEVELOPMENT ONLY)
    # ========================================================================
    # Uncomment to enable nginx stats endpoint
    # location /nginx-status {
    #     stub_status;
    #     access_log off;
    #     allow 127.0.0.1;
    #     allow 172.16.0.0/12;  # Docker internal
    #     deny all;
    # }
}

